name: Test on various platforms CI

on:
  push:
    branches:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          brew install \
            libmagic \
            libx11 \
            libxfixes \
            libxi \
            pkgconf \
            xclip \
            xorg-server
          cc --version
          pkg-config --version
          pkg-config --libs x11 xfixes xi libmagic

      - name: Build and Test
        run: |
          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1024x768x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 1
          ./build.sh test
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libmagic-dev \
            libx11-dev \
            libxfixes-dev \
            libxi-dev \
            pkg-config \
            psmisc \
            xclip \
            xvfb
          cc --version

      - name: Build and Test
        run: xvfb-run -a ./build.sh test

  freebsd:
    runs-on: ubuntu-24.04
    name: FreeBSD VM
    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            pkg install -y \
              bash \
              file \
              gcc \
              libX11 \
              libXfixes \
              libXi \
              pkgconf \
              xclip \
              xorg-vfbserver
            export DISPLAY=:99
            Xvfb "$DISPLAY" -screen 0 1024x768x24 &
            xvfb_pid=$!
            trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
            sleep 1
            cc --version
            pkg-config --version
            ./build.sh test

  openbsd:
    runs-on: ubuntu-24.04
    name: OpenBSD VM
    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          run: |
            pkg_add \
              file \
              libX11 \
              libXfixes \
              libXi \
              pkgconf \
              xclip \
              Xvfb
            export DISPLAY=:99
            Xvfb "$DISPLAY" -screen 0 1024x768x24 &
            xvfb_pid=$!
            trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
            sleep 1
            cc --version
            pkg-config --version
            ./build.sh test

  netbsd:
    runs-on: ubuntu-24.04
    name: NetBSD VM
    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          run: |
            pkgin -y install \
              file \
              libX11 \
              libXfixes \
              libXi \
              pkgconf \
              xclip \
              Xvfb
            export DISPLAY=:99
            Xvfb "$DISPLAY" -screen 0 1024x768x24 &
            xvfb_pid=$!
            trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
            sleep 1
            cc --version
            pkg-config --version
            ./build.sh test
