# Compiler detection is the source of the CC_* flags; it must inspect
# compiler-defined macros directly.
allow-rule PP-COMPILER-MACRO (^|/)cbase/platform_detection\.h$

# External API compatibility signatures.
allow-function-rule TYPE-CONST-SIGNATURE .* ^lstat$
allow-function-rule TYPE-CONST-SIGNATURE .* ^history_callback_delete$
# allow-rule FMT-MULTIPLY .*
# allow-rule FMT-TRAILING-COMMA .*
allow-rule FMT-NESTED-BRACES (^|/)config\.h$
allow-rule FMT-NESTED-BRACES (^|/)main_standalone_cases\.h$
allow-function-rule TYPE-CONST-SIGNATURE (^|/)src/curses/nc_window\.c$ ^nc_prompt_attempt_completion$
allow-macro-rule FMT-CALL-FIRST-TOPLEVEL .* ^NC_SCREEN_COLUMN_CAPABILITY_CALLBACKS$

# Flattening this declaration would exceed the 80-column limit.
allow-function-rule FMT-FUNC-WRAP (^|/)cbase/cbase\.h$ ^cmd_windows_argv0$

# Keep the external libmagic ABI name in the local fallback declaration.
allow-typedef-rule TYPE-POINTER-TYPEDEF (^|/)src/cy_input\.c$ ^magic_t$

# LENGTH is defined using SIZEOF division; replacing it with LENGTH recurses.
allow-rule STYLE-SIZEOF-LENGTH (^|/)cbase/base_macros\.h$
allow-rule STYLE-SIZEOF-LENGTH (^|/)nolibc\.c$

# False positives: boolean callback invocations are not pointer tests.
# STYLE-POINTER-NOT has no function-scoped suppression; exempt these files.
allow-rule STYLE-POINTER-NOT (^|/)src/c/ncm_regex\.c$
allow-rule STYLE-POINTER-NOT (^|/)src/c/ncm_tags\.c$
allow-rule STYLE-POINTER-NOT (^|/)src/curses/nc_menu\.c$
allow-rule STYLE-POINTER-NOT (^|/)src/ctc_text\.c$
allow-rule STYLE-STRCMP (^|/)cbase.h$
allow-rule STYLE-STRCMP (^|/)assertions.c$
# Temporarily suppress STYLE-STATIC-ONCE while the existing findings in
# cystemas/csanecheck_findings.txt are being processed. The targeted
# cross-file exceptions are no longer necessary after inclusion analysis.
allow-rule STYLE-STATIC-ONCE (^|/)cbase/.*
allow-rule STYLE-STATIC-ONCE (^|/)cystemas/.*

# STYLE-STATIC-ONCE reports outside function scope, so its false-positive
# exceptions must be file-scoped. The CY_META entry points below are referenced
# by generated metadata, not textual calls in boiler_furnace_pressure.c.
allow-rule STYLE-STATIC-ONCE (^|/)examples/boiler_furnace_pressure\.c$

# Static functions in pendulum_control.c are used as WASM model callbacks in
# web/wasm_sim.c, which includes the example as a C implementation file.
allow-rule STYLE-STATIC-ONCE (^|/)examples/pendulum_control\.c$

# CY_META callback entry points in pendulum_derivatives.c are referenced
# by generated metadata, not by explicit source-level calls.
allow-rule STYLE-STATIC-ONCE (^|/)examples/pendulum_derivatives\.c$
